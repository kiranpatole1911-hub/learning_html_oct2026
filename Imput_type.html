<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input type</title>
</head>
<body>
    <h2>All input type in HTML</h2>
<form>
<label>First Name</label>
<input type="text" placeholder="Enter your name"/>
<br><br>
<label>last Name</label>
<input type="text" placeholder="Enter last name"/>
<br><br>
<label>Email id</label>
<input type="email" placeholder="enter your email"/>
<br><br>
<label>enter fax number</label>
<input type="number" placeholder="Enter fax number"/>
<br><br>
<label>select DOB</label>
<input type="date">
<br><br>
<label >select month</label>
<input type="month">
<br><br>
<label >select Week</label>
<input type="week">
<br><br>
<label >select time</label>
<input type="time">
<br><br>
<label >date and time</label>
<input type="datetime-local">
<br><br>
<label >Choose city</label>
<input type="checkbox" checked>mumbai
<input type="checkbox">jalna
<input type="checkbox">jalgon
<input type="checkbox">pune
<br><br>
<label >select Gender</label>
<input type="radio" name="Gender"/>male
<input type="radio" name="Gender"/>female
<input type="radio" name="Gender"/>other
<br><br>
<label >select color</label>
<input type="color">
<br><br>
<label >Select Range</label>
<input type="range"/>
<br><br>
<label >Uplod Docs</label>
<input type="file" multiple/>
<br><br>
<label >Enter passwords</label>
<input type="password" placeholder="enter your passwords"/>
<br><br>
<label >search</label>
<input type="search" placeholder="Enter to search"/>
<br><br>
<label >Enter URL</label>
<input type="url" placeholder="https://example.com">
<br><br>
<label >phone number</label>
<input type="tel" placeholder="Enter your phone number">
<br><br>
<label >Select country</label>
<select>
    <option >Choose ......</option>
    <option >India</option>
    <option >chaina</option>
    <option >UK</option>
    <option >Shilanka</option>
</select>
<br><br>
<label > Enter address</label> <br>
<textarea rows="20" cols="40"></textarea>
<input type="submit" value="submit"/>
<input type="button" value="submit"/>
<input type="reset" value="reset"/>
</form>    
</body>
</html>
